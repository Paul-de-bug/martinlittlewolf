<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Littlewolf &mdash; 2027 Solutions</title>
    <link rel="stylesheet" href="./styles/build.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre&amp;display=swap" rel="stylesheet">
</head>

<body class="font-abhaya">
    <header class="flex flex-col items-center justify-center border-b-2 border-black pb-2 relative z-10">
        <a class="cursor-pointer" href="index.html">
            <img src="./assets/logoblack.png" width="300" alt="Martin Littlewolf" class="mb-4">
        </a>

        <div class="navigation flex flex-col-4 -mt-12 w-full relative">
            <a href="solutions-9000-2027-solutions.html" class="text-3xl md:mr-16 mr-4 hover:font-bold hover:underline transition ease-in duration-300 w-1/4 absolute top-4 items-center"><span style="vertical-align: middle;">&larr;</span><span>Back</span></a>

            <button id="prevBtn" class="hidden text-3xl md:mr-16 mr-4 hover:font-bold hover:underline transition ease-in duration-300 w-1/4">Previous</button>

            <aside class="relative w-full mb-4 mx-auto border border-black justify-center md:w-2/4">
                <select id="imageDropdown" class="appearance-none bg-customGray p-4 pr-12 w-full text-2xl md:text-3xl hover:bg-gray-300 transition ease-in duration-300 cursor-pointer outline-none"></select>
                <div class="absolute top-1/2 right-4 transform -translate-y-1/2">
                    <img src="./assets/dropdown-svgrepo-com.svg" alt="Dropdown arrow" class="h-6 w-6">
                </div>
            </aside>

            <button id="nextBtn" class="hidden text-3xl md:ml-16 ml-4 hover:font-bold hover:underline transition ease-in duration-300 w-1/4">Next</button>
        </div>
    </header>

    <div id="printIcon" class="hidden flex justify-center md:justify-end md:mr-10 mt-4">
        <button type="button" onclick="printCurrentImage()" class="flex flex-col text-2xl items-center font-bold relative z-10 w-16">
            <img src="./assets/printer-svgrepo-com.svg" alt="Print">
            <h3>PRINT</h3>
        </button>
    </div>

    <main class="mx-auto flex justify-center items-center">
        <div class="container flex">
            <div class="slideshow -my-12 md:-my-48 lg:-my-56 z-0 mx-auto">
                <img alt="Solution" id="slideshowImage" class="relative z-0">
                <p id="imageError" class="hidden text-xl text-center mt-12 px-4">This solution image has not been added yet.</p>
            </div>
        </div>
    </main>

    <footer class="border-t-2 border-black pb-2 z-10 relative mt-8">
        <p class="text-center mt-10">© 2023 by Martin Littlewolf</p>
    </footer>

    <script>
        const imageCount = 224;
        const imageDirectory = './assets/Solutions - 9000 - 2027';
        const imageExtensions = ['svg', 'png'];
        let currentImage = 0;
        let imageRequestId = 0;

        function updateImage() {
            const requestedImage = currentImage;
            const requestId = ++imageRequestId;
            const imgElement = document.getElementById('slideshowImage');
            const imageError = document.getElementById('imageError');
            const printerIcon = document.getElementById('printIcon');
            let extensionIndex = 0;

            imgElement.classList.remove('hidden');
            imageError.classList.add('hidden');
            imgElement.alt = requestedImage === 0 ? '2027 solutions' : `Solution for puzzle ${requestedImage}`;

            function loadNextFormat() {
                if (requestId !== imageRequestId) {
                    return;
                }

                if (extensionIndex >= imageExtensions.length) {
                    imgElement.onerror = null;
                    imgElement.removeAttribute('src');
                    imgElement.classList.add('hidden');
                    imageError.classList.remove('hidden');
                    printerIcon.classList.add('hidden');
                    return;
                }

                const extension = imageExtensions[extensionIndex++];
                imgElement.src = `${imageDirectory}/${requestedImage}.${extension}`;
            }

            imgElement.onload = function() {
                if (requestId !== imageRequestId) {
                    return;
                }
                imgElement.onerror = null;
                printerIcon.classList.toggle('hidden', requestedImage === 0);
            };
            imgElement.onerror = loadNextFormat;
            loadNextFormat();
        }

        function populateDropdown() {
            const dropdown = document.getElementById('imageDropdown');
            const defaultOption = document.createElement('option');
            defaultOption.value = 0;
            defaultOption.textContent = 'Select';
            defaultOption.selected = true;
            dropdown.appendChild(defaultOption);

            for (let i = 1; i <= imageCount; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Puzzle ${i}`;
                dropdown.appendChild(option);
            }
        }

        document.getElementById('prevBtn').onclick = function() {
            if (currentImage > 1) {
                currentImage--;
                document.getElementById('imageDropdown').value = currentImage;
                updateImage();
            }
        };

        document.getElementById('nextBtn').onclick = function() {
            if (currentImage < imageCount) {
                currentImage++;
                document.getElementById('imageDropdown').value = currentImage;
                updateImage();
            }
        };

        document.getElementById('imageDropdown').addEventListener('change', function() {
            currentImage = Number.parseInt(this.value, 10);
            updateImage();
        });

        window.onload = function() {
            populateDropdown();
            updateImage();
        };

        function printCurrentImage() {
            const imageSrc = document.getElementById('slideshowImage').src;
            if (!imageSrc) {
                return;
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write('<html><head><title>Print</title></head><body>');
            printWindow.document.write('<img src="' + imageSrc + '" width="100%">');
            printWindow.document.write('</body></html>');
            printWindow.document.close();

            setTimeout(function() {
                printWindow.print();
            }, 500);
        }
    </script>
</body>

</html>
